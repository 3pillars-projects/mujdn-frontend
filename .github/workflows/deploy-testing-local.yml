name: Deploy Angular to local IIS (192.168.0.88)

on:
  push:
    branches:
      - testing-local
  workflow_dispatch:

concurrency:
  group: deploy-testing-local-frontend
  cancel-in-progress: false

jobs:
  build_and_deploy:
    # Self-hosted runner installed on the IIS server (192.168.0.88)
    runs-on: [self-hosted, windows, mujdn-testing]
    env:
      # Angular is served from the .NET app's wwwroot
      IIS_WWWROOT: ${{ vars.IIS_WWWROOT || 'C:\inetpub\wwwroot\mujdn\wwwroot' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      # Mirrors dist/browser into wwwroot, but keeps the server's
      # assets/resources/environment.json (hand-edited URLs) if it exists.
      - name: Copy files to IIS wwwroot
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist\browser'
          if (-not (Test-Path (Join-Path $source 'index.html'))) { throw "Build output not found in $source" }

          New-Item -ItemType Directory -Force -Path $env:IIS_WWWROOT | Out-Null
          $excludeFiles = @()
          $serverEnv = Join-Path $env:IIS_WWWROOT 'assets\resources\environment.json'
          if (Test-Path $serverEnv) {
            $excludeFiles += $serverEnv
            Write-Host "Keeping server file: $serverEnv"
          }

          if ($excludeFiles.Count -gt 0) {
            robocopy $source $env:IIS_WWWROOT /MIR /R:3 /W:5 /NP /NFL /NDL /XF $excludeFiles
          } else {
            robocopy $source $env:IIS_WWWROOT /MIR /R:3 /W:5 /NP /NFL /NDL
          }
          # robocopy exit codes 0-7 mean success
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          exit 0
