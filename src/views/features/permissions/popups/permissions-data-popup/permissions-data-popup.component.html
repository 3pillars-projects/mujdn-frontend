<div [dir]="direction">
  <div class="p-6">
    <button (click)="close()" class="block ms-auto">
      <i class="pi pi-times close-popup"></i>
    </button>
    <h3 class="text-[#1f2a37 font-[600] mb-4 text-lg sm:text-xl">
      {{ 'PERMISSION_PAGE.PERMISSION_DATA' | translate }}
    </h3>

    <app-permission-details-card [model]="model" [downloadAttachment]="downloadAttachment" />

    <div class="actions mt-6 flex items-center justify-between gap-4">
      <button (click)="close()" class="btn gray-btn">{{ 'COMMON.CANCEL' | translate }}</button>
      <div class="flex gap-2">
        @if (showDownloadPdf) {
          <button
            class="btn green-btn"
            (click)="downloadAsPDF()"
            [disabled]="isDownloadingPdf"
            [attr.aria-busy]="isDownloadingPdf"
          >
            @if (isDownloadingPdf) {
              <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
              {{ 'PERMISSION_PAGE.GENERATING_REPORT' | translate }}
            } @else {
              <img src="assets/icons/download-qr.svg" alt="" />
              {{ 'PERMISSION_PAGE.DOWNLOAD_AS_FILE' | translate }}
            }
          </button>
        }
        @if (model.canTakeAction && !authService.isRootDepartmentOversightOnly) {
          <button class="btn red-btn" (click)="rejectPermission()">
            {{ 'PERMISSION_PAGE.DECLINE' | translate }}
          </button>
          <button class="btn green-btn" (click)="acceptPermission()">
            {{ 'PERMISSION_PAGE.APPROVE' | translate }}
          </button>
        } @else if (model.canRejectAfterAcceptance && authService.isRootDepartmentAdmin) {
          <button class="btn red-btn" (click)="rejectPermission()">
            {{ 'PERMISSION_PAGE.DECLINE' | translate }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
